Desc: '专业试驾场v1.1平台导入版：本人确认所属大类与年级 → 一个活动的基础试算、条件变化、修改试算 → 本人反思与可跳过的意向专业 → 代码核对类内/跨类范围
  → 本人确认记录。

  唯一入口参数task_id必填，只能为route/sensor/control，须由学生选择。所属大类在工作流内收集；大类未知仍可体验，不给具体分流资格判断。

