        1. 未来产业精英：智能科学与技术（具身与行为智能特色班）、智能医学工程（脑机接口特色班）、新能源科学与工程（数智能源特色班）、材料化学（新材料特色班）、生物技术（生物智造特色班）

        2. 信息科学与技术：计算机科学与技术、物联网工程、信息安全、自动化、智能科学与技术、软件工程

        3. 物理与光电信息技术工程：物理学、应用物理学、光电信息科学与工程、电子信息科学与技术、微电子科学与工程、电子科学与技术、通信工程

        4. 物质科学：化学、应用化学、生物科学、材料物理、材料化学

        5. 数智经济金融：数字经济、金融科技

        6. 卓越拔尖计划伯芩班（信息方向，用于界面区分）：计算机科学与技术、智能科学与技术、光电信息科学与工程

        7. 数学与大数据：数学与应用数学、信息与计算科学、统计学、数据科学

        8. 卓越拔尖计划伯芩班（理科方向，用于界面区分）：物理学、量子信息科学、化学、生物科学

        9. 不清楚/暂不提供（可以继续活动体验，暂不给具体分流建议）

        两组伯芩班专业集合不同，请明确选6或8。'
