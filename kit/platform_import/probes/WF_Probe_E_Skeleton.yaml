        NodeCode: db93hfu86c9hvm6hf4h0
        Path: raw_output
        RefType: node_field
      Language: 1
      OutputSchema:
      - Name: final_text
        Type: 0
      - Name: ok
        Type: 2
      Retries: 0
      TimeoutSeconds: 120
